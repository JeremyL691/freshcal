# The Treasury calendar that matches the published dates exactly (§9.10 A).
#
# The US federal holiday list (`country: US`) is the wrong calendar for this source:
# it expects publications on two days the bond market was closed (Good Friday) and
# skips one day the bond market was open (Veterans Day observed). Both differences are
# fixed with explicit overrides rather than by switching to a market calendar, which
# would introduce five other mismatches. See docs/validation.md, section A.
weekend: [sat, sun]
holidays:
  - country: US
overrides:
  - non_working_days: ["2024-03-29", "2025-04-18"]  # Good Friday: bond market closed
  - working_days: ["2023-11-10"]                    # Veterans Day observed: market open
valid_until: "2025-12-31"
