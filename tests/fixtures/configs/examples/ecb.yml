version: 1

connection:
  type: duckdb
  path: ":memory:"

calendars:
  target:
    weekend: [sat, sun]
    holidays:
      - financial: XECB

sources:
  - name: ecb.fx_rates
    relation: raw.ecb_fx_rates
    loaded_at_field: _loaded_at
    schedule: {kind: business_days, time: "16:00", timezone: Europe/Berlin}
    calendar: target
    grace: 2h
    observed_timezone: UTC
