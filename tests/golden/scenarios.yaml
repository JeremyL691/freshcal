# Golden scenarios (BLUEPRINT.md §3.10).
#
# Every row is a normative expected output: `status`, the reported release and its
# deadline, the next expected arrival, the counts, warning codes, the error code (null
# for verdicts) and the explanation sentence derived by hand from the §8.4 templates.
# Optional `release_adjusted_from`, `release_dst` and `release_clamped` pin the reported
# release's metadata; `next_adjusted_from` pins the next expected arrival's (G13, where
# the rolled release is the upcoming one rather than the reported one). `observed` is an aware ISO string, a naive ISO string (interpreted in the
# rule's observed_timezone), or null.
#
# Rule shorthands from §3.10: ECB = business_days 16:00 Europe/Berlin, XECB holidays,
# grace 2h; BY3 = monthly_business_day 3, 09:00 Europe/Berlin, DE-BY holidays, grace 4h;
# CN = business_days 15:00 Asia/Shanghai, CN holidays, six make-up workdays,
# valid_until 2026-12-31, grace 2h; B230 = cron "30 2 * * *" Europe/Berlin, grace 1h.

- id: G01
  title: ECB Monday morning with Friday's data (dbt issue #4450)
  rule:
    schedule: {kind: business_days, time: "16:00", timezone: Europe/Berlin}
    calendar: {holidays: [{financial: XECB}]}
    grace: 2h
  now: 2026-09-28T05:30:00Z
  observed: 2026-09-25T14:07:00Z
  expect:
    status: ON_TIME
    release: 2026-09-25T14:00:00Z
    deadline: 2026-09-25T16:00:00Z
    next_expected_arrival: 2026-09-28T14:00:00Z
    missed_count: 0
    missed_truncated: false
    pending_count: 0
    warning_codes: []
    error_code: null
    explanation: "On time: latest release Fri 2026-09-25 16:00 CEST arrived (observed Fri 2026-09-25 16:07 CEST); next release Mon 2026-09-28 16:00 CEST."

