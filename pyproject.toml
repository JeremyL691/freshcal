[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freshcal"
version = "0.1.3"
description = "Business-calendar-aware data freshness checks: schedules, holidays, grace windows, verdicts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Liu" }]
keywords = ["data-quality", "data-freshness", "dbt", "duckdb", "postgresql", "business-calendar", "holidays", "cron", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "croniter>=6.2.4,<7",
  "holidays>=0.105,<1",
  "jsonschema>=4.26,<5",
  "PyYAML>=6.0.3,<7",
  "tzdata>=2026.4; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/JeremyL691/freshcal"
Repository = "https://github.com/JeremyL691/freshcal"
Issues = "https://github.com/JeremyL691/freshcal/issues"
Changelog = "https://github.com/JeremyL691/freshcal/blob/main/CHANGELOG.md"
Documentation = "https://github.com/JeremyL691/freshcal/tree/main/docs"

[project.optional-dependencies]
duckdb = ["duckdb>=1.5.6,<2", "pytz>=2026.4"]
postgres = ["psycopg[binary]>=3.3.6,<4"]

[project.scripts]
freshcal = "freshcal.cli:main"

# The sdist ships the package, its tests, the docs, the examples and the validation data;
# tool caches and build output stay out (hatchling also honours .gitignore). Release
# artifacts are built from the published source tree.
[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "docs",
  "examples",
  "validation",
  "scripts",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "LICENSE",
  "uv.lock",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "hypothesis>=6.168",
  "mypy>=2.3",
  "ruff>=0.16.9",
  "import-linter>=2.15",
  "pre-commit>=4.6",
  "types-croniter>=6.2.4",
  "types-PyYAML>=6.0.12",
  "types-jsonschema>=4.26",
  "types-pytz>=2026.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Markdown files contain code blocks that are quoted verbatim; ruff must never reformat
# them. A local `review/` directory (audit material, if present) is not product code.
extend-exclude = ["*.md", "review"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "TID", "PT", "N"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Inject a Clock (freshcal.core.ports.Clock); only adapters/clock.py reads the system clock."
"datetime.datetime.utcnow".msg = "Inject a Clock; only adapters/clock.py reads the system clock."
"datetime.datetime.today".msg = "Inject a Clock; only adapters/clock.py reads the system clock."
"datetime.date.today".msg = "Inject a Clock; only adapters/clock.py reads the system clock."
"time.time".msg = "Inject a Clock; only adapters/clock.py reads the system clock."
"time.localtime".msg = "FreshCal never uses the machine time zone."

[tool.ruff.lint.per-file-ignores]
"src/freshcal/adapters/clock.py" = ["TID251"]
# The replay report records the date it was produced; it is a validation report, not
# FreshCal's engine, so reading the wall clock for its header is intended.
"validation/replay_ecb.py" = ["TID251"]
# tests/oracle/oracle.py is an external reviewer's independent reference implementation,
# ported by T-7.1 and kept as close to the original as possible so the two can be diffed.
# Its W/A/B/U locals and long lines are part of that fidelity.
"tests/oracle/oracle.py" = ["N803", "N806", "C408", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# tests/conftest.py holds the shared FakeCalendarProvider; the repository root on
# sys.path lets test modules import it as `tests.conftest` without adding
# __init__.py files to the test tree.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not postgres and not oracle"]
markers = [
  "postgres: PostgreSQL integration tests (need FRESHCAL_TEST_PG_DSN)",
  "oracle: large seeded oracle-differential campaign (rule P1; CI and every close-out)",
]
xfail_strict = true

[tool.coverage.run]
source = ["freshcal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.importlinter]
root_package = "freshcal"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core is pure"
type = "forbidden"
source_modules = ["freshcal.core"]
forbidden_modules = ["freshcal.app", "freshcal.config", "freshcal.adapters", "freshcal.cli",
                     "holidays", "duckdb", "psycopg", "yaml", "jsonschema", "pytz"]

[[tool.importlinter.contracts]]
name = "Application layer depends only on core"
type = "forbidden"
source_modules = ["freshcal.app"]
forbidden_modules = ["freshcal.config", "freshcal.adapters", "freshcal.cli",
                     "holidays", "duckdb", "psycopg", "yaml", "jsonschema"]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on the application or CLI"
type = "forbidden"
source_modules = ["freshcal.config", "freshcal.adapters"]
forbidden_modules = ["freshcal.app", "freshcal.cli"]
