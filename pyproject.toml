[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freshcal"
version = "0.1.0.dev0"
description = "Business-calendar-aware data freshness checks: schedules, holidays, grace windows, verdicts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Liu" }]
keywords = ["data-quality", "data-freshness", "dbt", "business-calendar", "holidays", "data-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "croniter>=6.2.4,<7",
  "holidays>=0.105,<1",
  "jsonschema>=4.26,<5",
  "PyYAML>=6.0.3,<7",
  "tzdata>=2026.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.5.6,<2", "pytz>=2026.4"]
postgres = ["psycopg[binary]>=3.3.6,<4"]

[project.scripts]
freshcal = "freshcal.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "hypothesis>=6.168",
  "mypy>=2.3",
  "ruff>=0.16.9",
  "import-linter>=2.15",
  "pre-commit>=4.6",
  "types-croniter>=6.2.4",
  "types-PyYAML>=6.0.12",
  "types-jsonschema>=4.26",
  "types-pytz>=2026.4",
]
